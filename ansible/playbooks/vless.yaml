- name: "Setup VLESS"
  hosts: clouds
  tasks:
    - name: Ping hosts
      ansible.builtin.ping:

    - name: Update APT
      ansible.builtin.apt:
        update_cache: true
        upgrade: true
      become: true
      become_user: root

    - name: Install Outline setup script
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/mhsanaei/3x-ui/master/install.sh
        dest: /tmp/install.sh
        mode: '666'
        force: true
      become: true
      become_user: root

    - name: Setup Outline
      ansible.builtin.shell: /tmp/install.sh
      args:
        executable: /bin/bash
